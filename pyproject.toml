[project]
name = "supply-chain-ml-project"
version = "2.0.0"
description = "End-to-end ML pipeline for supply chain analytics: late delivery prediction and demand forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Data Processing
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "polars>=1.35.1",

    # Data Storage
    "pyarrow>=22.0.0",
    "fastparquet>=2024.11.0",

    # Machine Learning
    "scikit-learn>=1.7.2",
    "xgboost>=2.0.0",
    "shap>=0.45.0",

    # Deep Learning
    "torch>=2.9.0",

    # Visualization
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "plotly>=6.3.1",

    # Notebooks & Dashboard
    "jupyter>=1.1.1",
    "dash>=3.2.0",

    # Data Source
    "kagglehub>=0.3.13",

    # Utilities
    "joblib>=1.4.0",
]

[project.scripts]
supply-chain = "main:main"
