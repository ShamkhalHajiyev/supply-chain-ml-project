[project]
name = "supply-chain-ml-project"
version = "2.0.0"
description = "End-to-end ML pipeline for supply chain analytics: late delivery detection"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Data Processing
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "polars>=1.0.0",

    # Data Storage
    "pyarrow>=15.0.0",
    "fastparquet>=2024.2.0",

    # Machine Learning
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "catboost>=1.2",
    "lightgbm>=4.0.0",
    "optuna>=3.5.0",
    "shap>=0.44.0",
    "imbalanced-learn>=0.12.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "kaleido>=0.2.1",

    # Notebooks & Dashboard
    "jupyter>=1.0.0",
    "dash>=2.14.0",
    "ipywidgets>=8.0.0",
    # NOTE: ydata-profiling removed due to incompatible dependency constraints

    # Data Source
    "kagglehub>=0.3.0",

    # Utilities
    "joblib>=1.3.0",
]

[project.scripts]
supply-chain = "main:main"
